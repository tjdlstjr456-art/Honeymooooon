<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spain Trip 숙소 레이아웃 패치</title><style>body{font-family:system-ui,sans-serif;max-width:600px;margin:60px auto;padding:20px;color:#203047;line-height:1.7}label{display:block;padding:24px;border:2px dashed #abc0d6;border-radius:14px;background:#f6f9fd}button{border:0;border-radius:10px;padding:12px 18px;background:#315fd1;color:#fff;font-size:15px;font-weight:700}#status{margin-top:14px}code{background:#eee;padding:3px}
/* V14 accommodation layout correction — desktop table + iPhone day cards */
.ov-sheet .ov-chip.hotel {
  display:block; width:100%; max-width:100%; min-width:0;
  margin:0 0 4px; padding:5px 6px;
  text-align:left; font-size:11px; line-height:1.35;
  font-weight:600; white-space:normal; overflow-wrap:anywhere;
}
.ov-sheet .ov-chip.hotel small {
  display:block; font-size:10px; font-weight:400; line-height:1.3;
  margin-top:2px; color:#755b9e;
}
.ov-mobile .ov-hotel {
  display:flex; flex-direction:row; align-items:center;
  justify-content:flex-start; gap:8px; min-width:0;
  text-align:left; font-size:12px; line-height:1.4;
}
.ov-mobile .ov-hotel > span {
  order:0; display:block; flex:1 1 auto; min-width:0;
  margin:0; font-size:12px; line-height:1.4; text-align:left;
  font-weight:400; overflow-wrap:anywhere;
}
.ov-mobile .ov-hotel > span b {
  font-size:12px; font-weight:700; line-height:1.4;
}
.ov-mobile .ov-hotel > span small {
  font-size:10px; font-weight:400; line-height:1.3;
  color:#76688c;
}
.ov-mobile .ov-hotel > button {
  order:1; flex:0 0 auto; width:auto; min-width:0;
  margin:0 0 0 auto; padding:5px 8px;
  font-size:11px; line-height:1.35; text-align:center;
}
</style></head><body><h2>Spain Trip 숙소 표시 수정</h2><p>지금 GitHub에 올려둔 <code>index.html</code>을 선택해 줘. 선택한 파일은 외부로 전송되지 않고 이 브라우저에서 스타일만 수정해. <b>현재 설정한 암호와 Google Sheets 연결 코드는 그대로 유지돼.</b></p><label>기존 <code>index.html</code> 선택<input id="input" type="file" accept=".html,text/html"></label><p><button id="fix" disabled>수정된 index.html 다운로드</button></p><p id="status" role="status">파일을 선택해 줘.</p><script>
const input=document.getElementById('input'),button=document.getElementById('fix'),status=document.getElementById('status');
const css='\n\n.ov-sheet .ov-chip.hotel {\n  display:block; width:100%; max-width:100%; min-width:0;\n  margin:0 0 4px; padding:5px 6px;\n  text-align:left; font-size:11px; line-height:1.35;\n  font-weight:600; white-space:normal; overflow-wrap:anywhere;\n}\n.ov-sheet .ov-chip.hotel small {\n  display:block; font-size:10px; font-weight:400; line-height:1.3;\n  margin-top:2px; color:#755b9e;\n}\n.ov-mobile .ov-hotel {\n  display:flex; flex-direction:row; align-items:center;\n  justify-content:flex-start; gap:8px; min-width:0;\n  text-align:left; font-size:12px; line-height:1.4;\n}\n.ov-mobile .ov-hotel > span {\n  order:0; display:block; flex:1 1 auto; min-width:0;\n  margin:0; font-size:12px; line-height:1.4; text-align:left;\n  font-weight:400; overflow-wrap:anywhere;\n}\n.ov-mobile .ov-hotel > span b {\n  font-size:12px; font-weight:700; line-height:1.4;\n}\n.ov-mobile .ov-hotel > span small {\n  font-size:10px; font-weight:400; line-height:1.3;\n  color:#76688c;\n}\n.ov-mobile .ov-hotel > button {\n  order:1; flex:0 0 auto; width:auto; min-width:0;\n  margin:0 0 0 auto; padding:5px 8px;\n  font-size:11px; line-height:1.35; text-align:center;\n}\n';
input.addEventListener('change',()=>{button.disabled=!input.files?.length; status.textContent=input.files?.length?'기존 파일을 확인했어. 수정된 파일을 생성할 수 있어.':'파일을 선택해 줘.'});
button.addEventListener('click',async()=>{try{const raw=await input.files[0].text();if(!raw.includes('</style>')||!raw.includes('ov-hotel'))throw Error('여행 플래너 HTML이 아니거나 숙소 코드가 없어.');const cleaned=raw.replace(/\/\* V14 accommodation layout correction[^]*?\*\//g,'');const out=cleaned.replace('</style>',css+'</style>');const blob=new Blob([out],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='index.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);status.textContent='완료! 다운로드한 index.html을 GitHub 저장소의 기존 파일과 교체해 줘.'}catch(e){status.textContent='오류: '+e.message}});
</script></body></html>
